[package]
name = "workbench-native"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
workbench-operations = { path = "../../../crates/workbench/operations" }
filesystem-protocol = { path = "../../../crates/filesystem/protocol" }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-websockets = { version = "0.13.3", features = ["client", "sha1_smol", "fastrand"] }

[dev-dependencies]
anyhow = "1"
