[package]
name = "workbench-component"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
# The generated bindings and forwarding name types of these crates by path.
binary-inspection = { path = "../../binary/inspection", features = ["wit"] }
workbench-operations = { path = "../operations", features = ["wit"] }
filesystem-data = { path = "../../filesystem/data", features = ["wit"] }
filesystem-protocol = { path = "../../filesystem/protocol", features = ["wit"] }
wit-bindgen = { version = "=0.63.0", features = ["async"] }
wit-reflect.workspace = true
