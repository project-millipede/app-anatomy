[package]
name = "linera-inspect-schema"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
linera-witty = { git = "https://github.com/linera-io/linera-protocol", rev = "672d97bb2fce3127db351069df72f1d225d8f263", default-features = false, features = ["macros"] }
workbench-operations = { path = "../../../../operations", features = ["wit-inspect-probe"] }
binary-inspection = { path = "../../../../../binary/inspection", features = ["wit-inspect-probe"] }
filesystem-protocol = { path = "../../../../../filesystem/protocol" }
object = { version = "=0.40.0", default-features = false, features = ["read_core", "macho", "elf", "pe", "names"] }
