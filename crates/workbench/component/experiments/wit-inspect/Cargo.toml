[package]
name = "wit-inspect-witgenstein"
version = "0.0.0"
edition = "2024"
publish = false

# Keep generator dependencies and resolution out of the application workspace.
[workspace]
members = ["."]
default-members = ["."]
resolver = "3"

[dependencies]
witgenstein-rs-macros = { git = "https://github.com/tschneidereit/witgenstein", rev = "f915331135cd409893890b9fea91cd8a69d2e864" }
workbench-operations = { path = "../../../operations" }
binary-inspection = { path = "../../../../binary/inspection" }
filesystem-protocol = { path = "../../../../filesystem/protocol" }
object = { version = "=0.40.0", default-features = false, features = ["read_core", "macho", "elf", "pe", "names"] }
