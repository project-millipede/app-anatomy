[package]
name = "workbench-operations"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
wit-inspect-probe = ["dep:linera-witty"]

[dependencies]
binary-inspection = { path = "../../binary/inspection" }
filesystem-data = { path = "../../filesystem/data" }
filesystem-protocol = { path = "../../filesystem/protocol" }
serde = { version = "1", features = ["derive"] }
thiserror.workspace = true
linera-witty = { git = "https://github.com/linera-io/linera-protocol", rev = "672d97bb2fce3127db351069df72f1d225d8f263", default-features = false, features = ["macros"], optional = true }
