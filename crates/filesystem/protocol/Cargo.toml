[package]
name = "filesystem-protocol"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Reflection for the generated component contract. Off for ordinary builds.
wit = ["dep:wit-reflect", "filesystem-data/wit"]

[dependencies]
filesystem-data = { path = "../data", features = ["serde"] }
rmp-serde = "=1.3.1"
serde = { version = "1", features = ["derive"] }
serde_bytes = "=0.11.19"
thiserror.workspace = true
wit-reflect = { workspace = true, optional = true }
