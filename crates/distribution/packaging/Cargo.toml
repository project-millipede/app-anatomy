[package]
name = "packaging"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
apple-codesign = { version = "=0.29.0", default-features = false }
# Published 0.11.8 requires yanked ZIP versions. Pin upstream's ZIP 9 update.
cargo-packager = { git = "https://github.com/crabnebula-dev/cargo-packager", rev = "549b01a2e23c32f8faa190f962f034d777255f33", default-features = false, features = ["rustls-tls", "platform-certs"] }
embala-pkg = "=0.6.0"
tempfile = "=3.27.0"
